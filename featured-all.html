<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#fff6ee">
<title>精选作品 · 奇妙半糖梦境</title>
<link rel="stylesheet" href="fonts.css?v=35rk">
<link rel="stylesheet" href="style.css?v=35rk">
<style>
/* 独立精选页骨架（复用画廊页风格） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Serif SC',serif;
  background:linear-gradient(165deg,#ffeef4 0%,#ffe3ee 40%,#fbe4f2 75%,#f7e6f5 100%);
  overflow-x:hidden;min-height:100dvh;position:relative;
}
.gback{position:fixed;top:max(env(safe-area-inset-top),14px);left:14px;z-index:60;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;border:none;cursor:pointer;outline:none;background:rgba(255,255,255,.78);box-shadow:0 3px 12px rgba(216,130,160,.28);-webkit-tap-highlight-color:transparent;transition:transform .18s}
.gback:hover{transform:translateY(-1px)}
.gback:active{transform:scale(.92)}
.gback::before{content:"";width:11px;height:11px;border-left:2.5px solid #a4506e;border-bottom:2.5px solid #a4506e;transform:rotate(45deg) translate(1px,-1px);margin-right:6px}
.fa-head{text-align:center;padding:max(env(safe-area-inset-top),26px) 16px 10px;position:relative;z-index:2}
.fa-head h1{font-family:'Noto Serif SC',serif;font-size:clamp(1.3rem,4.5vw,1.9rem);color:#a4506e;letter-spacing:.3em;text-indent:.3em;text-shadow:0 1px 0 #fff}
.fa-head p{font-size:.72rem;color:#c08ca4;letter-spacing:.22em;margin-top:4px}
#fa-wall{position:relative;z-index:2;padding:10px clamp(8px,3vw,40px) 80px;max-width:1060px;margin:0 auto}
/* 瀑布流：手机 2 列，桌面 4 列 */
#fa-wall{column-count:2;column-gap:10px}
@media (min-width:641px){#fa-wall{column-count:4;column-gap:14px}}
#fa-wall .featured-card{break-inside:avoid}
#fa-loading{text-align:center;color:#c08ca4;padding:60px 0;font-size:.9rem;letter-spacing:.2em}
</style>
</head>
<body>
<button class="gback" id="back" aria-label="返回主页"></button>
<header class="fa-head"><h1>精选作品</h1><p>— The Wonder Half-Sugar Dreamland —</p></header>
<main id="fa-wall"><div id="fa-loading">甜度加载中…</div></main>
<script src="topic-sdk.js?v=35rk" type="text/javascript"></script>
<script src="featured-all.js?v=35rk" type="text/javascript"></script>
</body>
</html>
